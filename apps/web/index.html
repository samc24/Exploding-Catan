<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Exploding Catan</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header>
    <h1>Exploding <span>Catan</span></h1>
    <span id="hint"></span>
    <div class="spacer"></div>
    <span id="modeTag" hidden></span>
    <button class="sm" id="rulesBtn">Rules</button>
    <button class="sm" id="newBtn">New Game</button>
  </header>
  <div id="seats"></div>
  <div id="stage">
    <div id="boardArea">
      <svg id="board"></svg>
      <div id="dice"></div>
      <div id="piles"><div id="pile"></div><div id="deck"></div></div>
      <div id="panels"></div>
      <div id="showcase" hidden></div>
      <div id="clock" hidden></div>
    </div>
    <div id="side">
      <div id="sidetabs"><button class="sm on" data-tab="feed">Game log</button><button class="sm" data-tab="log">Details</button></div>
      <div id="feed"></div>
      <div id="log" hidden></div>
    </div>
  </div>
  <div id="bottom"></div>
  <div id="modal" hidden></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
