<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Exploding Catan</title>
  <meta name="theme-color" content="#221914">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Exploding Catan">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header>
    <h1 id="homeBtn" title="Home"><span class="ex">Exploding</span> <span class="ca">Catan</span></h1>
    <span id="hint"></span>
    <div class="spacer"></div>
    <span id="dirTag" title="Turn order" hidden></span>
    <span id="modeTag" hidden></span>
    <button class="sm" id="emojiBtn" title="Throw an emoji">😏</button>
    <div id="emojiTray" hidden></div>
    <button class="sm" id="sideBtn" title="Game log and chat">Log</button>
    <span id="netTag" hidden></span>
    <button class="sm" id="onlineBtn">Online</button>
    <button class="sm" id="newBtn">New Game</button>
    <button class="sm" id="menuBtn" title="Settings">⚙</button>
    <div id="menu" hidden>
      <div class="mrow" id="musicRow"></div>
      <div class="mrow" id="sfxRow"></div>
      <button class="sm phone" id="menuNew">New game</button>
      <button class="sm phone" id="menuOnline">Play online</button>
      <button class="sm" id="fxBtn">Motion: full</button>
      <button class="sm" id="tipBtn">Tips: on</button>
      <button class="sm" id="fsBtn" hidden>⛶ Fullscreen</button>
      <button class="sm" id="rulesBtn">Rules</button>
      <button class="sm" id="recordsBtn">Records</button>
      <button class="sm warn" id="menuLeave" hidden>Leave game</button>
      <div class="mrow phone" id="homeTip" hidden>For the whole screen, with no browser bars: add this page to your Home Screen (Share, or the browser's menu) and open the game from there.</div>
    </div>
  </header>
  <div id="seats"></div>
  <div id="stage">
    <div id="boardArea">
      <svg id="board"></svg>
      <div id="dice"></div>
      <div id="piles"><div id="pile"></div><div id="deck"></div></div>
      <div id="panels"></div>
      <div id="showcase" hidden></div>
      <div id="clock" hidden></div>
      <div id="ticker" title="Open the log"></div>
      <div id="zoomWrap"><button class="sm" id="zoomIn" title="Zoom in">+</button><button class="sm" id="zoomOut" title="Zoom out">−</button><button class="sm" id="zoomReset" title="Reset view">⌂</button></div>
    </div>
    <div id="side">
      <div id="sidetabs"><button class="sm on" data-tab="feed">Game log</button><button class="sm" data-tab="log">Details</button><button class="sm" data-tab="chat" id="chatTab">Chat</button><button class="sm" data-tab="dice">Dice</button></div>
      <div id="feed"></div>
      <div id="log" hidden></div>
      <div id="dicepanel" hidden></div>
      <div id="chat" hidden><div id="chatlog"></div></div>
      <form id="chatrow" hidden><input id="chatin" maxlength="140" placeholder="Say something to the table…" autocomplete="off"><button class="sm" type="submit">Send</button></form>
    </div>
  </div>
  <div id="bottom"></div>
  <!-- The landing is the first paint: it stays up until the script decides
       what to show, so the empty table never flashes behind it. -->
  <div id="landing"><div class="hero"><div class="hero-text"><p class="kicker">A kitchen-table game</p><h1><span class="ex">Exploding</span> <span class="ca">Catan</span></h1></div></div></div>
  <div id="modal" hidden></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
