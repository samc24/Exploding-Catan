<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Exploding Catan</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <header>
    <h1 id="homeBtn" title="Home"><span class="ex">Exploding</span> <span class="ca">Catan</span></h1>
    <span id="hint"></span>
    <div class="spacer"></div>
    <span id="dirTag" title="Turn order" hidden></span>
    <span id="modeTag" hidden></span>
    <button class="sm" id="emojiBtn" title="Throw an emoji">😏</button>
    <div id="emojiTray" hidden></div>
    <button class="sm" id="sideBtn" title="Game log and chat">Log</button>
    <span id="netTag" hidden></span>
    <button class="sm" id="onlineBtn">Online</button>
    <button class="sm" id="newBtn">New Game</button>
    <button class="sm" id="menuBtn" title="Settings">⚙</button>
    <div id="menu" hidden>
      <div class="mrow" id="musicRow"></div>
      <div class="mrow" id="sfxRow"></div>
      <button class="sm" id="fsBtn" hidden>⛶ Fullscreen</button>
      <button class="sm" id="rulesBtn">Rules</button>
    </div>
  </header>
  <div id="seats"></div>
  <div id="stage">
    <div id="boardArea">
      <svg id="board"></svg>
      <div id="dice"></div>
      <div id="piles"><div id="pile"></div><div id="deck"></div></div>
      <div id="panels"></div>
      <div id="showcase" hidden></div>
      <div id="clock" hidden></div>
      <div id="zoomWrap"><button class="sm" id="zoomIn" title="Zoom in">+</button><button class="sm" id="zoomOut" title="Zoom out">−</button><button class="sm" id="zoomReset" title="Reset view">⌂</button></div>
    </div>
    <div id="side">
      <div id="sidetabs"><button class="sm on" data-tab="feed">Game log</button><button class="sm" data-tab="log">Details</button><button class="sm" data-tab="chat" id="chatTab" hidden>Chat</button><button class="sm" data-tab="dice">Dice</button></div>
      <div id="feed"></div>
      <div id="log" hidden></div>
      <div id="dicepanel" hidden></div>
      <div id="chat" hidden><div id="chatlog"></div></div>
      <form id="chatrow" hidden><input id="chatin" maxlength="140" placeholder="Say something to the table…" autocomplete="off"><button class="sm" type="submit">Send</button></form>
    </div>
  </div>
  <div id="bottom"></div>
  <div id="landing" hidden></div>
  <div id="modal" hidden></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
