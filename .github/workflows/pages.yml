# Publishes the web app to GitHub Pages once CI is green on master. /new/,
# where the app lived while the original game held the root, redirects up.
name: Pages
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The game server the Online dialog connects to (render.yaml); people then only type a room code.
      - run: npm run build -w apps/web
        env:
          VITE_SERVER_URL: wss://exploding-catan.onrender.com
      - name: Assemble site
        run: |
          mkdir -p _site/new
          cp -R apps/web/dist/. _site/
          cat > _site/new/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Exploding Catan</title>
          <meta http-equiv="refresh" content="0; url=../">
          <link rel="canonical" href="../">
          <script>location.replace("../" + location.search + location.hash)</script>
          <p>Moved: <a href="../">play here</a>.</p>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
