name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build -w apps/web
  e2e:
    # The runner image ships Google Chrome, so playwright-core drives it without a download.
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w apps/web
      - name: Serve the build and the game server, then play
        run: |
          set -e
          (cd apps/web && nohup npx vite preview --port 5173 --strictPort > /tmp/vite.log 2>&1 &)
          nohup npx tsx apps/server/src/index.ts > /tmp/server.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ >/dev/null && curl -sf http://localhost:8787/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then echo "servers did not come up"; cat /tmp/vite.log /tmp/server.log; exit 1; fi
          npm run e2e -w apps/web
          npm run e2e:online -w apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-shots
          path: apps/web/e2e/shots
