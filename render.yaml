# The game server on Render's free plan: the Dockerfile as-is, serving the
# web app and the WebSocket on one port. Free services sleep after fifteen
# idle minutes (a game in progress keeps one awake) and have no disk, so
# DATA_DIR is left unset: rooms live in memory until the next sleep. The
# web app on Pages points at wss://exploding-catan.onrender.com
# (VITE_SERVER_URL in pages.yml). fly.toml is the paid, always-on option.
services:
  - type: web
    name: exploding-catan
    runtime: docker
    plan: free
    region: ohio
    branch: master
    healthCheckPath: /health
    # Not on every merge: a redeploy drops every connection and forgets every
    # room, and most merges only touch the web app (which Pages serves). When
    # the server or the packages change, deploy by hand from the dashboard
    # (Manual Deploy → Deploy latest commit).
    autoDeploy: false
    envVars:
      - key: PORT
        value: "8787"
