# The game server on Fly.io, for when it is worth a few dollars a month: one
# small machine that never stops (rooms and clocks live in it), with a
# volume on /data so a restart keeps the rooms. Not in use yet; the server
# runs on Render's free plan (render.yaml). To switch, deploy this and point
# VITE_SERVER_URL in pages.yml at wss://<app>.fly.dev.
app = "exploding-catan"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
